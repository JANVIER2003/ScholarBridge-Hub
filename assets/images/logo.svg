<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 80" width="330" height="80" role="img" aria-labelledby="sbh-logo-title sbh-logo-desc">
  <title id="sbh-logo-title">ScholarBridge Hub</title>
  <desc id="sbh-logo-desc">SBH bridge monogram with the wordmark ScholarBridge Hub, the tagline "Bridging ambition to global opportunity." and the contact number +250 784 315 928.</desc>
  <style>
    .name { fill: #1c2821; }
    .hub { fill: #244c3b; }
    .tag { fill: #68736b; }
    .phone { fill: #244c3b; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #f5f7f3; }
      .hub { fill: #d9ed7d; }
      .tag { fill: #b5c2b8; }
      .phone { fill: #dce9dd; }
    }
  </style>
  <defs>
    <filter id="sbh-logo-glow" filterUnits="userSpaceOnUse" x="0" y="38" width="72" height="22">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(0 8)">
    <path fill="#244c3b" d="M32 2a30 30 0 0 1 30 30 30 30 0 0 1-30 30H10a8 8 0 0 1-8-8V32A30 30 0 0 1 32 2z"/>
    <path d="M6 41h52" fill="none" stroke="#e3a942" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
    <path d="M33 41h9.5" fill="none" stroke="#f4c86a" stroke-width="2.2" stroke-linecap="round" filter="url(#sbh-logo-glow)"/>
    <path d="M9 41C15 16 49 16 55 41" fill="none" stroke="#d9ed7d" stroke-width="3.5" stroke-linecap="round"/>
    <path fill="#c9df6a" d="M26.5 18.6v3.6c3.3 2.2 7.7 2.2 11 0v-3.6L32 21.3z"/>
    <path fill="#d9ed7d" d="M32 11l10 5-10 5-10-5z"/>
    <path d="M42 16v5.4" fill="none" stroke="#e3a942" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="42" cy="22.4" r="1.4" fill="#e3a942"/>
    <text x="32" y="56" fill="#ffffff" font-family="Manrope, 'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".6" text-anchor="middle">SBH</text>
  </g>
  <g font-family="Manrope, 'Avenir Next', 'Segoe UI', Arial, sans-serif">
    <text class="name" x="80" y="33" font-size="22" font-weight="700">ScholarBridge <tspan class="hub" font-weight="800">Hub</tspan></text>
    <text class="tag" x="80" y="51" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">Bridging ambition to global opportunity.</text>
    <text class="phone" x="80" y="68" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing=".3">+250 784 315 928</text>
  </g>
</svg>
